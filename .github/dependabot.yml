# Weekly dependency update PRs (Roadmap Task 3.8). CI must pass before any of them is merged.
# The livekit-agents family is pinned together on purpose (see AI-receptionist-1/pyproject.toml):
# upgrade it by hand, all plugins at once.
version: 2
updates:
  - package-ecosystem: uv
    directory: /AI-receptionist-1
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "livekit*"
      - dependency-name: "openai"
    groups:
      python-minor:
        update-types: [minor, patch]

  # npm workspaces (dashboard/, platform-dashboard/, packages/shared/) share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/AI-receptionist-1, /dashboard, /platform-dashboard, /landing-page]
    schedule: { interval: monthly }

  # Images and actions are pinned by digest / commit SHA (audit QA-06); these PRs keep the pins fresh.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: monthly }
