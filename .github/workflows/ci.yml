name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:        # deploy.yml runs the same checks before building a release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-receptionist-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest
        env:
          APP_ENV: development
      - name: .env.example lists every setting
        env:
          APP_ENV: development
        run: |
          uv run --frozen python - <<'EOF'
          import re, sys
          from config import Settings
          documented = set(re.findall(r"^#?\s*([A-Z][A-Z0-9_]+)=", open(".env.example", encoding="utf-8").read(), re.M))
          missing = sorted(set(Settings.model_fields) - documented)
          if missing:
              sys.exit(f".env.example is missing: {', '.join(missing)}")
          print(f"OK: {len(documented)} variables documented")
          EOF

  # Conversation evals against the real LLM (tests/evals). Runs only when the repository has an
  # EVAL_OPENAI_API_KEY secret; without it every eval skips. A few cents per run.
  evals:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: AI-receptionist-1
    env:
      EVAL_OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Voice agent evals
        run: uv run --frozen pytest tests/evals -rs
        env:
          APP_ENV: development
          RUN_EVALS: ${{ secrets.EVAL_OPENAI_API_KEY != '' && '1' || '0' }}
      # The fallback LLM must pass the same evals before it carries calls (Task 3.5).
      - name: Voice agent evals on the fallback LLM
        run: uv run --frozen pytest tests/evals -rs
        env:
          APP_ENV: development
          EVAL_LLM: fallback
          EVAL_ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          RUN_EVALS: ${{ secrets.EVAL_OPENAI_API_KEY != '' && secrets.EVAL_ANTHROPIC_API_KEY != '' && '1' || '0' }}

  # Client dashboard, platform admin app, landing page and the shared package (npm workspaces at the repo root).
  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:shared
      - run: npm run build
      - name: Landing-page prices match core/billing/plans.py
        run: npm run check:prices -w landing-page
      - name: Landing-page colours meet WCAG AA
        run: npm run check:contrast -w landing-page
      - name: The client bundle carries no platform-admin code
        run: "! grep -lE '/platform/(tenants|sales|costs)' dashboard/dist/assets/*.js"

  # Roadmap Task 3.8: known-vulnerable dependencies and committed secrets fail the build.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Python dependencies (pip-audit against uv.lock)
        working-directory: AI-receptionist-1
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          # Ignored on purpose, each with its reason. Remove the line when the reason goes away.
          # - opentelemetry-api 1.44 (CVE-2026-114603, CVE-2026-126360): livekit-agents 1.8.6 caps it
          #   below 1.45. Fixed by moving the livekit-agents family to 1.8.7+, which needs openai>=3.
          uvx pip-audit -r /tmp/requirements.txt --require-hashes --disable-pip \
            --ignore-vuln CVE-2026-114603 --ignore-vuln CVE-2026-126360
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend dependencies (npm audit, production only, all workspaces)
        run: npm audit --omit=dev --audit-level=high
      # Scans the files as committed now. Scan the full history once by hand (PRODUCTION_CHECKLIST §1):
      # anything found there must be rotated, not just deleted.
      - name: Secrets in the repository (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --no-git --redact --no-banner

  # The images and compose files are only exercised on deploy otherwise; build them on every PR.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Backend images (api, jobs, worker share their layers)
        run: |
          for target in api jobs worker; do
            docker buildx build --load --target "$target" -t "receptionist-$target:ci" AI-receptionist-1
          done
      - name: Images start with a safe config and run as non-root
        run: |
          test "$(docker run --rm receptionist-api:ci id -u)" = "10001"
          docker run --rm -e APP_ENV=development receptionist-api:ci python -c "import main, jobs.worker; print('imports ok')"
          docker run --rm -e APP_ENV=development receptionist-worker:ci python -c "import agent.worker; print('worker imports ok')"
      - name: Frontend images (built from the repo root, npm workspaces)
        run: |
          for app in dashboard platform-dashboard; do
            docker buildx build --load -f "$app/Dockerfile" \
              --build-arg VITE_API_URL=https://api.example.com \
              --build-arg VITE_CLIENT_URL=https://app.example.com \
              --build-arg VITE_PLATFORM_URL=https://admin.example.com \
              -t "receptionist-$app:ci" .
          done
          docker buildx build --load -f landing-page/Dockerfile \
            --build-arg VITE_SITE_URL=https://www.example.com \
            --build-arg VITE_DASHBOARD_SIGNUP_URL=https://app.example.com/signup \
            --build-arg VITE_DASHBOARD_LOGIN_URL=https://app.example.com/login \
            -t receptionist-landing:ci .
      - name: Compose files are valid
        run: |
          cp AI-receptionist-1/.env.example AI-receptionist-1/.env
          docker compose -f docker-compose.yml config -q
          docker compose -f AI-receptionist-1/docker-compose.dev.yml config -q
          touch /tmp/ci.env
          IMAGE_PREFIX=ghcr.io/x/receptionist TAG=v0 DEPLOY_ENV=staging ENV_FILE=/tmp/ci.env \
            API_DOMAIN=api.example.com APP_DOMAIN=app.example.com ADMIN_DOMAIN=admin.example.com \
            docker compose -f deploy/docker-compose.prod.yml config -q
