name: deploy-environment

# Deploy one release tag to one environment. Called by deploy.yml; not triggered on its own.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      tag: { type: string, required: true }
      image_prefix: { type: string, required: true }

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Vite bakes the API URL into the bundle, so the dashboard is built per environment.
      - name: Build and push the dashboard for this environment
        run: |
          test -n "${{ vars.API_URL }}" || { echo "Set the API_URL variable on the ${{ inputs.environment }} environment" >&2; exit 1; }
          docker buildx build --push \
            --build-arg VITE_API_URL="${{ vars.API_URL }}" \
            --build-arg VITE_APP_ENV="${{ inputs.environment }}" \
            --build-arg VITE_SENTRY_DSN="${{ vars.SENTRY_DSN_DASHBOARD }}" \
            --build-arg VITE_GIT_SHA="$(git rev-parse --short HEAD)" \
            -t "${{ inputs.image_prefix }}-dashboard:${{ inputs.tag }}-${{ inputs.environment }}" dashboard
      # The server keeps a checkout of this repo only for deploy/ (compose file, Caddyfile, script).
      # Workers drain live calls one at a time, so a deploy can take up to ~2 × LIVEKIT_DRAIN_TIMEOUT.
      - name: Roll the release onto the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 50m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
            git fetch --quiet --tags origin
            git checkout --quiet "${{ inputs.tag }}"
            bash deploy/deploy.sh "${{ inputs.tag }}" "${{ inputs.environment }}"
