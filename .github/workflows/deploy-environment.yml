name: deploy-environment

# Deploy one release tag to one environment. Called by deploy.yml; not triggered on its own.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      tag: { type: string, required: true }
      image_prefix: { type: string, required: true }

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Vite bakes the URLs into the bundles, so both frontends are built per environment
      # (from the repo root: they are npm workspaces sharing packages/shared).
      - name: Build and push the client dashboard and platform admin app for this environment
        run: |
          missing() { echo "Set the $1 variable on the ${{ inputs.environment }} environment" >&2; exit 1; }
          [ -n "$VAR_API_URL" ] || missing API_URL
          [ -n "$VAR_APP_URL" ] || missing APP_URL
          [ -n "$VAR_PLATFORM_URL" ] || missing PLATFORM_URL
          for app in dashboard platform-dashboard; do
            docker buildx build --push -f "$app/Dockerfile" \
              --build-arg VITE_API_URL="$VAR_API_URL" \
              --build-arg VITE_CLIENT_URL="$VAR_APP_URL" \
              --build-arg VITE_PLATFORM_URL="$VAR_PLATFORM_URL" \
              --build-arg VITE_APP_ENV="${{ inputs.environment }}" \
              --build-arg VITE_SENTRY_DSN="${{ vars.SENTRY_DSN_DASHBOARD }}" \
              --build-arg VITE_GIT_SHA="$(git rev-parse --short HEAD)" \
              -t "${{ inputs.image_prefix }}-$app:${{ inputs.tag }}-${{ inputs.environment }}" .
          done
        env:
          VAR_API_URL: ${{ vars.API_URL }}
          VAR_APP_URL: ${{ vars.APP_URL }}
          VAR_PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      # The public landing page, only on the environment that serves it (vars.SITE_URL set there;
      # the server's .deploy file then sets SITE_DOMAIN). Its links point at this environment's dashboard.
      - name: Build and push the landing page for this environment
        if: ${{ vars.SITE_URL != '' }}
        run: |
          docker buildx build --push -f landing-page/Dockerfile \
            --build-arg VITE_SITE_URL="$VAR_SITE_URL" \
            --build-arg VITE_DASHBOARD_SIGNUP_URL="${VAR_APP_URL%/}/signup" \
            --build-arg VITE_DASHBOARD_LOGIN_URL="${VAR_APP_URL%/}/login" \
            --build-arg VITE_DEMO_CALL_URL="$VAR_DEMO_CALL_URL" \
            --build-arg VITE_BOOK_DEMO_URL="$VAR_BOOK_DEMO_URL" \
            --build-arg VITE_DEMO_PHONE_AU="$VAR_DEMO_PHONE_AU" \
            --build-arg VITE_DEMO_PHONE_UK="$VAR_DEMO_PHONE_UK" \
            --build-arg VITE_PRIVACY_URL="$VAR_PRIVACY_URL" \
            --build-arg VITE_TERMS_URL="$VAR_TERMS_URL" \
            --build-arg VITE_DPA_URL="$VAR_DPA_URL" \
            --build-arg VITE_CLAIM_ZDR="${VAR_CLAIM_ZDR:-false}" \
            --build-arg VITE_WEB_DEMO="${VAR_WEB_DEMO:-false}" \
            --build-arg VITE_API_URL="$VAR_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VAR_GOOGLE_SIGNIN_CLIENT_ID" \
            -t "${{ inputs.image_prefix }}-landing:${{ inputs.tag }}-${{ inputs.environment }}" .
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_APP_URL: ${{ vars.APP_URL }}
          VAR_DEMO_CALL_URL: ${{ vars.DEMO_CALL_URL }}
          VAR_BOOK_DEMO_URL: ${{ vars.BOOK_DEMO_URL }}
          VAR_DEMO_PHONE_AU: ${{ vars.DEMO_PHONE_AU }}
          VAR_DEMO_PHONE_UK: ${{ vars.DEMO_PHONE_UK }}
          VAR_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          VAR_TERMS_URL: ${{ vars.TERMS_URL }}
          VAR_DPA_URL: ${{ vars.DPA_URL }}
          VAR_CLAIM_ZDR: ${{ vars.CLAIM_ZDR }}
          # Live "Talk to it now" demo: WEB_DEMO=true plus the (public) Google sign-in client id
          VAR_WEB_DEMO: ${{ vars.WEB_DEMO }}
          VAR_API_URL: ${{ vars.API_URL }}
          VAR_GOOGLE_SIGNIN_CLIENT_ID: ${{ vars.GOOGLE_SIGNIN_CLIENT_ID }}
      # The server keeps a checkout of this repo only for deploy/ (compose file, Caddyfile, script).
      # Workers drain live calls one at a time, so a deploy can take up to ~2 × LIVEKIT_DRAIN_TIMEOUT.
      - name: Roll the release onto the server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 50m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
            git fetch --quiet --tags origin
            git checkout --quiet "${{ inputs.tag }}"
            bash deploy/deploy.sh "${{ inputs.tag }}" "${{ inputs.environment }}"
