<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel AI Receptionist — Live Call</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      padding: 20px;
      color: #f0f0f0;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .hotel-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(247,151,30,0.4);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
    }

    /* ── Visualiser ── */
    .visualiser {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 60px;
      margin-bottom: 26px;
    }

    .bar {
      width: 5px;
      background: linear-gradient(to top, #f7971e, #ffd200);
      border-radius: 3px;
      animation: none;
      height: 6px;
      transition: height 0.1s ease;
    }

    .bar.active { animation: bounce 0.8s ease-in-out infinite; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.15s; }
    .bar:nth-child(6) { animation-delay: 0.05s; }
    .bar:nth-child(7) { animation-delay: 0.25s; }
    .bar:nth-child(8) { animation-delay: 0.35s; }

    @keyframes bounce {
      0%, 100% { height: 6px;  }
      50%       { height: 44px; }
    }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,0.15);
      min-width: 180px;
      justify-content: center;
    }

    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
    }
    .dot.green  { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.yellow { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulse 1s infinite; }
    .dot.red    { background: #f87171; box-shadow: 0 0 8px #f87171; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-join {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a1a;
      box-shadow: 0 6px 20px rgba(247,151,30,0.45);
    }
    .btn-join:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(247,151,30,0.55);
    }

    .btn-leave {
      background: rgba(248,113,113,0.15);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.35);
    }
    .btn-leave:hover:not(:disabled) {
      background: rgba(248,113,113,0.25);
    }

    .btn-mute {
      background: rgba(255,255,255,0.08);
      color: #d1d5db;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-mute:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
    .btn-mute.muted { color: #f87171; border-color: rgba(248,113,113,0.35); }

    .meters { display: none; margin: 4px 0 16px; text-align: left; }
    .meter-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
    .meter-row > span { width: 118px; flex: none; }
    .meter { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .meter-fill { height: 100%; width: 0%; border-radius: 4px; background: #34d399; transition: width 80ms linear; }
    .meter-fill.agent { background: #60a5fa; }
    .mic-select { width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 10px; font-size: 12px;
      color: #e5e7eb; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
    .mic-select option { color: #111; }
    .tip.warn { color: #fca5a5; }

    .controls { display: flex; gap: 10px; }
    .controls .btn { flex: 1; margin-bottom: 0; }

    .tip {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
    }

    .error-box {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-top: 14px;
      display: none;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="hotel-logo">🏨</div>
  <h1 id="hotelName">Hotel AI Receptionist</h1>
  <p class="subtitle" id="subtitle">Live voice call with our AI front desk</p>

  <!-- Audio visualiser bars -->
  <div class="visualiser" id="visualiser">
    <div class="bar" id="b1"></div><div class="bar" id="b2"></div>
    <div class="bar" id="b3"></div><div class="bar" id="b4"></div>
    <div class="bar" id="b5"></div><div class="bar" id="b6"></div>
    <div class="bar" id="b7"></div><div class="bar" id="b8"></div>
  </div>

  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="statusText">Ready to connect</span>
  </div>

  <button class="btn btn-join" id="joinBtn">🎙️ Join Call</button>

  <!-- Live levels: show which direction is broken (your mic, or the receptionist's voice) -->
  <div class="meters" id="meters">
    <div class="meter-row"><span>🎙️ Your microphone</span><div class="meter"><div class="meter-fill" id="micFill"></div></div></div>
    <div class="meter-row"><span>🔊 Receptionist</span><div class="meter"><div class="meter-fill agent" id="agentFill"></div></div></div>
    <select class="mic-select" id="micSelect" title="Choose your microphone"></select>
  </div>

  <div class="controls" style="display:none" id="liveControls">
    <button class="btn btn-mute" id="muteBtn">🔇 Mute</button>
    <button class="btn btn-leave" id="leaveBtn">📵 Leave</button>
  </div>

  <p class="tip" id="tip">Allow microphone access when prompted. Speak naturally after connecting.</p>
  <div class="error-box" id="errorBox"></div>
</div>

<!-- Pinned version + Subresource Integrity: a compromised CDN can't inject code into the call page.
     To upgrade: change the version, then recompute the hash:
     curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.24.0/dist/livekit-client.umd.min.js"
        integrity="sha384-Hl+KHTfsO7AqyofjkXnR+WrOR0RM4MGeruUR9Rulz3adxJKuh0LQUYWvVwgKm0m+"
        crossorigin="anonymous"></script>
<script>
  const LK = window.LivekitClient;
  const $ = id => document.getElementById(id);

  // UI refs
  const hotelNameEl = $("hotelName");
  const subtitleEl  = $("subtitle");
  const dotEl       = $("dot");
  const statusEl    = $("statusText");
  const joinBtn     = $("joinBtn");
  const liveControls= $("liveControls");
  const muteBtn     = $("muteBtn");
  const leaveBtn    = $("leaveBtn");
  const tipEl       = $("tip");
  const errorBox    = $("errorBox");
  const bars        = Array.from(document.querySelectorAll(".bar"));
  const metersEl    = $("meters");
  const micFill     = $("micFill");
  const agentFill   = $("agentFill");
  const micSelect   = $("micSelect");

  let room = null;
  let muted = false;
  let audioCtx = null;
  let analyser = null;
  let animFrame = null;
  const remoteAudioEls = new Map();

  // ── Helpers ──────────────────────────────────────────────────────────────

  function getRoomId() {
    const parts = window.location.pathname.split("/").filter(Boolean);
    // path: /call/{room_id}
    return parts[parts.length - 1] || "default-room";
  }

  function setStatus(text, dotClass) {
    statusEl.textContent = text;
    dotEl.className = "dot " + (dotClass || "");
  }

  function showError(msg) {
    errorBox.style.display = "block";
    errorBox.textContent = "⚠️ " + msg;
    setStatus("Error", "red");
  }

  function setVisualiserActive(active) {
    bars.forEach(b => b.classList.toggle("active", active));
  }

  // ── Audio levels via Web Audio API ───────────────────────────────────────

  let micAnalyser = null, agentAnalyser = null;
  let micNode = null, connectedAt = 0, micPeak = 0, micWarned = false;
  const BAR_BINS = [1, 2, 3, 4, 6, 8, 12, 16];

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function analyserFor(mediaStreamTrack) {
    const ctx = getCtx();
    const a = ctx.createAnalyser();
    a.fftSize = 1024;
    const node = ctx.createMediaStreamSource(new MediaStream([mediaStreamTrack]));
    node.connect(a);
    return { a, node };
  }

  function rmsOf(a, buf) {
    a.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    return Math.sqrt(sum / buf.length);
  }

  function watchMic(mediaStreamTrack) {
    if (micNode) { try { micNode.disconnect(); } catch (_) {} micNode = null; }
    const { a, node } = analyserFor(mediaStreamTrack);
    micAnalyser = a; micNode = node;
    micPeak = 0; micWarned = false; connectedAt = Date.now();
    tipEl.classList.remove("warn");
  }

  function startMeters() {
    metersEl.style.display = "block";
    const timeBuf = new Uint8Array(1024), freqBuf = new Uint8Array(512), agentBuf = new Uint8Array(1024);
    function draw() {
      animFrame = requestAnimationFrame(draw);
      if (micAnalyser) {
        micAnalyser.getByteFrequencyData(freqBuf);
        bars.forEach((bar, i) => {
          const val = freqBuf[BAR_BINS[i % BAR_BINS.length]] || 0;
          bar.style.height = Math.max(6, Math.floor((val / 255) * 52)) + "px";
        });
        const level = muted ? 0 : rmsOf(micAnalyser, timeBuf);
        micPeak = Math.max(micPeak, level);
        micFill.style.width = Math.min(100, level * 500) + "%";
        // Several seconds in and nothing but silence: almost always the wrong or muted microphone.
        if (!muted && !micWarned && Date.now() - connectedAt > 8000 && micPeak < 0.015) {
          micWarned = true;
          tipEl.classList.add("warn");
          tipEl.textContent = "⚠️ We can't hear your microphone. Pick the right one in the list below, and check " +
            "Windows Settings → System → Sound → Input (speak and watch the level bar there).";
        }
        if (micWarned && micPeak >= 0.015) {
          micWarned = false;
          tipEl.classList.remove("warn");
          tipEl.textContent = "You are live. The receptionist can hear you.";
        }
      }
      agentFill.style.width = agentAnalyser ? Math.min(100, rmsOf(agentAnalyser, agentBuf) * 500) + "%" : "0%";
    }
    draw();
  }

  function stopMeters() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    if (audioCtx)  { audioCtx.close().catch(() => {}); audioCtx = null; }
    micAnalyser = null; agentAnalyser = null; micNode = null;
    metersEl.style.display = "none";
    micFill.style.width = "0%"; agentFill.style.width = "0%";
    bars.forEach(b => { b.classList.remove("active"); b.style.height = "6px"; });
  }

  function localMicTrack() {
    const pub = room && room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
    return pub && pub.track ? pub.track.mediaStreamTrack : null;
  }

  async function loadMics() {
    try {
      const devs = await LK.Room.getLocalDevices("audioinput");
      micSelect.innerHTML = "";
      devs.forEach(d => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || "Microphone";
        micSelect.appendChild(o);
      });
      const active = room && room.getActiveDevice("audioinput");
      if (active) micSelect.value = active;
    } catch (_) { micSelect.style.display = "none"; }
  }

  micSelect.addEventListener("change", async () => {
    if (!room) return;
    try {
      await room.switchActiveDevice("audioinput", micSelect.value);
      const t = localMicTrack();
      if (t) watchMic(t);
    } catch (e) {
      console.error(e);
      showError("Couldn't switch to that microphone: " + (e.message || e));
    }
  });

  // ── Join call ─────────────────────────────────────────────────────────────

  async function joinCall() {
    errorBox.style.display = "none";
    joinBtn.disabled = true;
    setStatus("Connecting…", "yellow");
    tipEl.textContent = "Requesting microphone access…";

    try {
      const roomId = getRoomId();
      const link = new URLSearchParams(window.location.search);
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      // /talk/<business>?k=<key> is the permanent link: the server picks a fresh room for each visit.
      // /call/<room>?exp=&sig= is the signed, expiring link (WhatsApp "call me", dashboard test call).
      const qs = pathParts[0] === "talk"
        ? new URLSearchParams({ perm: link.get("k") || "", t: pathParts[1] || "default" })
        : new URLSearchParams({ room: roomId, exp: link.get("exp") || "", sig: link.get("sig") || "" });
      const resp = await fetch(`/livekit/token?${qs.toString()}`, { cache: "no-store" });
      if (!resp.ok) {
        let msg = "Token request failed (" + resp.status + ")";
        try { msg = (await resp.json()).detail || msg; } catch (_) {}
        if (resp.status === 403) msg = "This call link is invalid or has expired. Please ask for a new link.";
        if (resp.status === 429) msg = "The receptionist is busy right now. Please try again in a little while.";
        throw new Error(msg);
      }
      const data = await resp.json();

      // Show hotel name from API
      if (data.hotel_name) {
        hotelNameEl.textContent = data.hotel_name;
        document.title = data.hotel_name + " — Live Call";
        subtitleEl.textContent = `Speaking with ${data.receptionist_name || "AI Receptionist"}`;
      }

      setStatus("Joining room…", "yellow");
      room = new LK.Room({ adaptiveStream: true, dynacast: true });

      // Remote audio tracks → play through speaker
      room.on(LK.RoomEvent.TrackSubscribed, (track, _pub, _participant) => {
        if (track.kind === LK.Track.Kind.Audio) {
          if (remoteAudioEls.has(track.sid)) return;

          // Play EVERY remote audio track. The receptionist publishes two: its voice ("roomio_audio")
          // and a background track for the soft typing sound ("background_audio"). Keeping only the
          // newest one used to drop the voice and leave the caller in silence.
          const el = track.attach();
          el.autoplay = true;
          el.playsInline = true;
          el.style.display = "none";
          document.body.appendChild(el);
          remoteAudioEls.set(track.sid, el);
          // The voice track drives the "Receptionist" meter (the other one is the silent typing-sound track).
          if (_pub.trackName === "roomio_audio" && track.mediaStreamTrack) {
            agentAnalyser = analyserFor(track.mediaStreamTrack).a;
          }
        }
      });
      // If the browser blocks sound until the page is clicked, say so instead of staying silent.
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
        if (room && !room.canPlaybackAudio) {
          tipEl.textContent = "Your browser blocked sound. Click anywhere on this page to hear the receptionist.";
          document.addEventListener("click", () => { if (room) room.startAudio().catch(() => {}); }, { once: true });
        }
      });
      room.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
        const el = remoteAudioEls.get(track.sid);
        if (el) {
          try { track.detach(el); } catch (_) {}
          el.remove();
          remoteAudioEls.delete(track.sid);
          return;
        }
        track.detach().forEach(x => x.remove());
      });
      room.on(LK.RoomEvent.Disconnected, () => {
        onCallEnded();
      });

      await room.connect(data.url, data.token, {
        autoSubscribe: true,
        audioCaptureDefaults: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      // Enable microphone
      await room.localParticipant.setMicrophoneEnabled(true);

      // Start the level meters and the microphone list
      startMeters();
      const micTrack = localMicTrack();
      if (micTrack) watchMic(micTrack); else setVisualiserActive(true);
      await loadMics();

      setStatus("Connected — speak now", "green");
      tipEl.textContent = "You are live. The receptionist can hear you.";
      joinBtn.style.display = "none";
      liveControls.style.display = "flex";
      muteBtn.textContent = "🔇 Mute";
      muteBtn.classList.remove("muted");
      muted = false;

    } catch (err) {
      console.error(err);
      showError(err.message || "Failed to connect.");
      joinBtn.disabled = false;
      tipEl.textContent = "Allow microphone access when prompted. Speak naturally after connecting.";
    }
  }

  // ── Mute toggle ───────────────────────────────────────────────────────────

  async function toggleMute() {
    if (!room) return;
    muted = !muted;
    await room.localParticipant.setMicrophoneEnabled(!muted);
    muteBtn.textContent = muted ? "🎙️ Unmute" : "🔇 Mute";
    muteBtn.classList.toggle("muted", muted);
    setStatus(muted ? "Muted" : "Connected — speak now", muted ? "yellow" : "green");
  }

  // ── Leave call ────────────────────────────────────────────────────────────

  async function leaveCall() {
    if (room) { await room.disconnect(); room = null; }
    onCallEnded();
  }

  function onCallEnded() {
    remoteAudioEls.forEach(el => {
      try { el.remove(); } catch (_) {}
    });
    remoteAudioEls.clear();
    stopMeters();
    setStatus("Call ended", "red");
    tipEl.textContent = "Thank you for calling. You may close this window.";
    joinBtn.style.display = "block";
    joinBtn.disabled = false;
    joinBtn.textContent = "🔄 Reconnect";
    liveControls.style.display = "none";
  }

  // ── Event listeners ───────────────────────────────────────────────────────

  joinBtn.addEventListener("click", joinCall);
  muteBtn.addEventListener("click", toggleMute);
  leaveBtn.addEventListener("click", leaveCall);
</script>
</body>
</html>
