[project]
name = "ai-receptionist-backend"
version = "0.1.0"
description = "AI receptionist: FastAPI API, LiveKit voice worker, WhatsApp"
requires-python = ">=3.12,<3.14"
# Exact pins: an unpinned deploy can pull a breaking release on any day.
# Upgrade deliberately: change a pin, `uv lock`, run the tests, commit both files.
dependencies = [
    # Core framework
    "fastapi==0.162.3",
    "starlette==1.6.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",          # form parsing for Twilio webhooks
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.2.2",
    "protobuf==5.29.6",
    # Database
    "motor==3.7.1",
    "pymongo==4.18.3",
    # LLM / speech
    "openai==2.54.0",
    "elevenlabs==2.78.0",
    # Telephony / messaging
    "twilio==9.3.7",
    "httpx==0.27.2",
    # LiveKit
    "livekit==1.1.20",
    "livekit-api==1.2.2",
    # 1.1.28–1.1.31 are yanked: they break chat-history upload with livekit-agents 1.7.0–1.8.8.
    "livekit-protocol==1.1.27",
    # Every livekit-agents plugin must match the livekit-agents version exactly.
    # 1.8.7+ needs openai>=3 (a major upgrade) — move the whole family together, on purpose.
    "livekit-agents==1.8.6",
    "livekit-plugins-openai==1.8.6",
    "livekit-plugins-elevenlabs==1.8.6",
    "livekit-plugins-silero==1.8.6",
    "livekit-plugins-deepgram==1.8.6",          # streaming STT (Nova-3)
    "livekit-plugins-cartesia==1.8.6",          # fallback TTS
    "livekit-plugins-noise-cancellation==0.3.3",  # BVCTelephony for SIP audio (LiveKit Cloud)
    # Ops
    "sentry-sdk==2.75.0",
    "tzdata==2026.6",                    # IANA timezones on Windows
    # stdlib audioop was removed in 3.13; only the legacy Twilio path needs it
    "audioop-lts==0.2.2; python_version >= '3.13'",
    # Security
    "argon2-cffi==25.1.0",             # password hashing (argon2id) for dashboard users
    "cryptography==50.0.2",            # Fernet encryption of OAuth refresh tokens (calendar integrations)
    # Phase 3: shared state, job queue, metrics, LLM fallback
    "redis==5.3.1",                    # rate limits, dedupe, per-tenant call counters (arq 0.28 needs redis<6)
    "arq==0.28.0",                     # Redis job queue: reminders, digests, calendar sync, WhatsApp replies
    "prometheus-client==0.26.0",       # /metrics on the API (the worker has its own: LIVEKIT_PROMETHEUS_PORT)
    "livekit-plugins-anthropic==1.8.6",  # fallback LLM when OpenAI is down (must match livekit-agents)
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "mongomock-motor>=0.0.34",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.40.0",               # in-memory Redis for tests
]

[tool.uv]
package = false

# ── Tests ───────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]  # legacy utcnow()/audioop noise; revisit in Phase 1
markers = [
    "integration: needs a real MongoDB (MONGODB_TEST_URI)",
]

# ── Lint ────────────────────────────────────────────────
# Start lenient on the legacy code (real errors only); new code in core/ gets the full set.
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"core/**" = []

# ── Types ───────────────────────────────────────────────
# Lenient to start: core/ and agent/ are checked; tighten as modules move into core/.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["core", "agent"]

# Legacy modules imported by core/ — not type-checked until they move or are deleted.
[[tool.mypy.overrides]]
module = ["ai.*", "database.*", "whatsapp.*", "voice.*", "routers.*", "services.*", "utils.*"]
ignore_errors = true
