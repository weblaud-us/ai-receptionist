# Local development: the whole product with one command (Roadmap Task 3.3).
#
#   docker compose up --build        (or: make dev, npm run stack)
#
#   API        http://localhost:8002      (docs at /docs, metrics at /metrics)
#   Dashboard  http://localhost:5173      (businesses)
#   Platform   http://localhost:5174      (platform admins)
#   MongoDB    localhost:27017            Redis  localhost:6379
#
# Reads AI-receptionist-1/.env (copy .env.example first) and overrides only where the containers
# differ from your machine: MongoDB and Redis are the services below. To use your Atlas dev
# database instead of the local MongoDB: DEV_MONGODB_URI="mongodb+srv://…" docker compose up
#
# Code is mounted, so the API, the voice worker and both frontends reload when you save a file.
# The first start installs the frontend packages (about a minute); later starts reuse them until
# package-lock.json changes. The sales worker starts too, but nothing is dialled without
# OUTBOUND_DIALER_ENABLED=true in .env and a started campaign or an approved single call.
# Other compose files: AI-receptionist-1/docker-compose.dev.yml (public call link tunnels, local
# Kokoro voice) and deploy/docker-compose.prod.yml (staging / production).

x-backend: &backend
  build: { context: ./AI-receptionist-1, target: dev }
  env_file: ./AI-receptionist-1/.env
  environment:
    APP_ENV: development
    MONGODB_URI: ${DEV_MONGODB_URI:-mongodb://mongo:27017}
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:4321   # 4321: landing page live demo
    DASHBOARD_URL: http://localhost:5173
    COOKIE_SECURE: "false"
  volumes:
    - ./AI-receptionist-1:/app
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  api:
    <<: *backend
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload --proxy-headers
    ports: ["8002:8002"]

  # The voice agent. Needs LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET and OPENAI_API_KEY in .env.
  worker:
    <<: *backend
    command: python -m agent.worker dev

  # The outbound sales agent (Phase 4). Only ever started by the dialer for one call: it never answers
  # an inbound call. Nothing is dialled without OUTBOUND_DIALER_ENABLED=true in .env and a started
  # campaign or an approved single call. Without it, single calls are cancelled after 2 minutes.
  sales-worker:
    <<: *backend
    command: python -m agent.sales_worker dev

  # Reminders, digests, calendar sync, WhatsApp replies, the dialer tick. Failed jobs: python -m jobs dead
  jobs:
    <<: *backend
    command: python -m jobs

  # The frontends are npm workspaces (dashboard/, platform-dashboard/, landing-page/, packages/shared/),
  # so they mount the repo root. Every node_modules folder is a volume: Linux binaries and the Vite
  # cache stay apart from the host copy. frontend-deps installs once (only when package-lock.json
  # changed), then every dev server starts from that install.
  frontend-deps:
    <<: &frontend
      image: node:22-alpine
      working_dir: /repo
      environment:
        VITE_API_URL: http://localhost:8002
        VITE_CLIENT_URL: http://localhost:5173
        VITE_PLATFORM_URL: http://localhost:5174
        VITE_APP_ENV: development
        # Bind mounts from a Windows or macOS host don't deliver file-change events: poll instead.
        DEV_WATCH_POLLING: "true"
        npm_config_fetch_retries: "5"
        npm_config_fetch_retry_maxtimeout: "120000"
      volumes:
        - ./:/repo
        - frontend_node_modules:/repo/node_modules
        - dashboard_app_node_modules:/repo/dashboard/node_modules
        - platform_app_node_modules:/repo/platform-dashboard/node_modules
        - shared_node_modules:/repo/packages/shared/node_modules
        - landing_app_node_modules:/repo/landing-page/node_modules
    command:
      - sh
      - -c
      - |
        lock="$$(sha1sum package-lock.json | cut -d' ' -f1)"
        if [ "$$(cat node_modules/.lock-sha 2>/dev/null)" = "$$lock" ]; then
          echo "node_modules is up to date with package-lock.json"
        else
          npm ci --no-audit --no-fund && echo "$$lock" > node_modules/.lock-sha
        fi

  dashboard:
    <<: *frontend
    command: npm run dev -w dashboard -- --host 0.0.0.0
    ports: ["5173:5173"]
    depends_on:
      frontend-deps: { condition: service_completed_successfully }

  platform-dashboard:
    <<: *frontend
    command: npm run dev -w platform-dashboard -- --host 0.0.0.0
    ports: ["5174:5174"]
    depends_on:
      frontend-deps: { condition: service_completed_successfully }

  # Public landing page (Astro). Its signup and sign-in buttons point at the local client dashboard.
  landing:
    <<: *frontend
    command: npm run dev -w landing-page -- --host 0.0.0.0 --port 4321
    ports: ["4321:4321"]
    environment:
      VITE_SITE_URL: http://localhost:4321
      VITE_DASHBOARD_SIGNUP_URL: http://localhost:5173/signup
      VITE_DASHBOARD_LOGIN_URL: http://localhost:5173/login
      DEV_WATCH_POLLING: "true"
      ASTRO_TELEMETRY_DISABLED: "1"
    depends_on:
      frontend-deps: { condition: service_completed_successfully }

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Lint, type check and the full test suite on Linux:  make test
  tests:
    build: { context: ./AI-receptionist-1, target: dev }
    command: sh -c "ruff check . && mypy && pytest"
    environment:
      APP_ENV: development
    volumes:
      - ./AI-receptionist-1:/app
    profiles: ["tools"]

volumes:
  mongo_data:
  frontend_node_modules:
  dashboard_app_node_modules:
  platform_app_node_modules:
  shared_node_modules:
  landing_app_node_modules:
